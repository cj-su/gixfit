[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gixfit"
version = "0.3.1"
description = "GIWAXS spot finding, candidate-structure fitting, lattice refinement and orientation search for fibre-textured films"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib", "tifffile", "pymatgen", "pandas", "openpyxl"]

[project.scripts]
gixfit = "gixfit.cli:main"

[project.gui-scripts]
gixfit-app = "gixfit.app:main"

[tool.setuptools]
packages = ["gixfit"]
